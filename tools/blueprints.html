["The Traffic Light",1923,"Garrett Morgan",["How can a tiny light keep a whole street safe? Let's find out together!", "Long ago, there were no traffic lights. Carts, cars, and people all moved at once.", "Garrett Morgan saw a car crash into a horse carriage. Nobody had time to stop.", "He built a signal with a warning position too, so everyone knew to slow down.", "A warning gives your eyes and brain time to see the light and press the brake.", "Imagine a ball rolling fast. You cannot stop it in one blink. You need a little time.", "Today, red means stop, green means go, and yellow means get ready. Cities run on this idea.", "One small warning made streets safer for everyone. Tiny ideas can protect people."],["Mystery: what stops a crash?","Flaw: no warning time","Change: add a pause","Force: time to brake","Result: one pause saves lives"]],

["The Telephone",1876,"Alexander Graham Bell",["Can your voice travel through a wire? Let's see how sound can become electricity.", "Long ago, a faraway message meant a letter or telegraph clicks. Real voices could not travel.", "Alexander Graham Bell wanted people to hear each other, not just read clicks.", "He built a thin plate that shakes with your voice and turns the shaking into an electric signal.", "The signal runs through a wire. At the other end, another plate shakes and makes the sound again.", "It is like shaking one end of a long rope. The shake travels all the way to the other end.", "Today, phones carry voices across the whole world in a moment.", "One clever plate helped people talk across distance. Ideas about sound changed how we connect."],["Mystery: can wires carry voice?","Flaw: clicks, not voices","Change: plate turns shake to signal","Force: shake becomes electric current","Result: instant talk across distance"]],

 h+='<div class="row"><button id="esv" class="pri">💾 Save Text</button><button id="ers">↺ Reset This Story</button></div><div class="mono" style="font-size:11px;color:#8fb4d6">Saved in this browser. If you made a Gemini voiceover, generate it again after changing text.</div>';
 $("em").innerHTML=h;const fill=y=>{$("e0").value=y[0];$("e1").value=y[1];$("e2").value=y[2];for(let k=0;k<NS;k++){$("s"+k).value=y[3][k]||"";if(k<5)$("p"+k).value=y[4][k].split(": ").pop()}};fill(x);
 $("ec").onclick=()=>$("modal2").style.display="none";
 $("esv").onclick=()=>{S[i]=[$("e0").value,+$("e1").value||$("e1").value,$("e2").value,[...Array(NS).keys()].map(k=>$("s"+k).value.trim()),[0,1,2,3,4].map(k=>$("p"+k).value.trim())];saveOv(i,S[i]);dropClips(i);for(let k=0;k<NS;k++)delete st.voice[i+"_"+k];listRefresh();st.t=0;st.scene=-1;$("modal2").style.display="none"};
 $("ers").onclick=()=>{S[i]=JSON.parse(JSON.stringify(DEF[i]));saveOv(i,null);dropClips(i);for(let k=0;k<NS;k++)delete st.voice[i+"_"+k];fill(S[i]);listRefresh()};
 $("modal2").style.display="block"};
$("an").onclick=()=>{st.auto=!st.auto;$("an").textContent="Auto-Next: "+(st.auto?"On":"Off");$("an").classList.toggle("on",st.auto)};document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tabs button").forEach(x=>x.classList.toggle("on",x==b));document.querySelectorAll(".tp").forEach(x=>x.classList.toggle("on",x.id==b.dataset.t))});
const ids=["c_sz","c_pos","c_hl","c_name","c_pace","c_in","c_out","c_fx","c_mu","c_mv","c_max"];
$("c_sz").value=cfg.sz*100;$("c_pos").value=cfg.pos;$("c_hl").value=cfg.hl;$("c_name").value=cfg.name;$("c_pace").value=cfg.pace*100;$("c_in").checked=cfg.intro;$("c_out").checked=cfg.outro;$("c_fx").checked=cfg.fx;$("c_mu").checked=cfg.music;$("c_mv").value=cfg.mv*100;$("c_max").value=cfg.maxd||0;
const upd=()=>{const o=[cfg.intro,cfg.outro,cfg.pace,cfg.maxd].join();cfg.maxd=+$("c_max").value;cfg.sz=$("c_sz").value/100;cfg.pos=$("c_pos").value;cfg.hl=$("c_hl").value;cfg.name=$("c_name").value;cfg.pace=$("c_pace").value/100;cfg.intro=$("c_in").checked;cfg.outro=$("c_out").checked;cfg.fx=$("c_fx").checked;cfg.music=$("c_mu").checked;cfg.mv=$("c_mv").value/100;if(o!=[cfg.intro,cfg.outro,cfg.pace,cfg.maxd].join()){st.t=0;st.scene=-1}if(st.mus)st.mus.g.gain.value=cfg.mv*.12;localStorage.setItem("ss",JSON.stringify(cfg))};
ids.forEach(id=>{$(id).addEventListener("input",upd);$(id).addEventListener("change",upd)});
$("thumb").onclick=()=>{if(st.rec)return;pause();const t0=st.t,si=cfg.intro;cfg.intro=false;const d=durs();st.t=d[0]+d[1]+d[2]+d[3]*.5;render();cfg.intro=si;cv.toBlob(b=>{const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=S[st.i][0].replace(/\W+/g,"_")+"_thumbnail.png";a.click();st.t=t0;st.scene=-1},"image/png")};
function voiceStat(){const n=[...Array(NS).keys()].filter(j=>st.voice[st.i+"_"+j]).length;$("vst").textContent="💾 Saved voice: "+n+"/"+NS+" clips"+(VDB.db?"":" (this session only)")}
$("voice").onchange=()=>{localStorage.setItem("gv",$("voice").value);if(genBusy)return;for(let j=0;j<NS;j++)delete st.voice[st.i+"_"+j];st.vn=st.vn||{};st.vn[st.i]=$("voice").value;loadStory(st.i,$("voice").value);voiceStat();st.t=0;st.scene=-1;pause()};
$("vclr").onclick=()=>{if(genBusy||!confirm("Delete the saved voice for this story?"))return;dropClips(st.i);for(let j=0;j<NS;j++)delete st.voice[st.i+"_"+j];voiceStat();st.t=0;st.scene=-1;pause()};
$("key").addEventListener("input",()=>localStorage.setItem("gk",$("key").value.trim()));
setInterval(()=>{const r=rawTotal(),t=total();$("dinfo").textContent="Length: "+Math.round(t)+"s"+(cfg.maxd&&r>cfg.maxd?(SP()/st.speed>1.001?" (voice sped up "+(SP()/st.speed).toFixed(2)+"x to fit)":""):"")+(cfg.maxd&&t>cfg.maxd+1?" — voice too long for this limit":"")},500);
setFmt("9:16 Reels/Shorts");pick(0);requestAnimationFrame(tick);
VDB.open().then(()=>VDB.all()).then(o=>{Object.assign(VDB.mem,o);if(st.rec)return;const n=loadStory(st.i,curVoice());voiceStat();if(n)$("rt").textContent="💾 Loaded "+n+" saved voice clips from this browser"});
